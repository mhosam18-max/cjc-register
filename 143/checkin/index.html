<html lang="en" dir="ltr">
<head>

<title>CJC Check-in</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #F4F2F9; color: #1F1B2E; font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; }
  header { background: linear-gradient(135deg, #281B5A, #4B2C8F); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  header img { width: 36px; height: 36px; border-radius: 50%; background: #fff; padding: 2px; flex: none; }
  header .t { flex: 1; min-width: 0; }
  header .t b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .t span { font-size: 12px; opacity: .85; }
  #count { flex: none; text-align: center; background: rgba(255,255,255,.14); border-radius: 10px; padding: 4px 10px; }
  #count b { display: block; font-size: 18px; } #count span { font-size: 11px; opacity: .85; }
  main { padding: 12px 16px 40px; max-width: 560px; margin: 0 auto; }
  #reader { width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
  #result { margin: 12px 0; border-radius: 14px; padding: 18px 14px; text-align: center; color: #fff; display: none; }
  #result .big { font-size: 24px; font-weight: 700; word-break: break-word; }
  #result .small { font-size: 15px; margin-top: 6px; }
  .ok { background: #1E8E3E; } .already { background: #E8710A; } .bad { background: #B3261E; } .wait { background: #5F6368; }
  button { font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px; padding: 13px; background: #281B5A; color: #fff; width: 100%; margin-top: 8px; cursor: pointer; }
  input { font: inherit; font-size: 16px; width: 100%; padding: 12px; border: 1px solid #CFC8E6; border-radius: 12px; margin-top: 10px; background: #fff; }
  .card { background: #fff; border: 1px solid #E4E0EE; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  #people .p { background: #fff; border: 1px solid #E4E0EE; border-radius: 12px; padding: 10px 12px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #people .p span { min-width: 0; word-break: break-word; }
  #people .p button { width: auto; margin: 0; padding: 8px 12px; font-size: 14px; flex: none; }
  #queueNote { display: none; background: #FFF3DC; border-color: #F3D9A6; }
  .muted { color: #6B6880; font-size: 13px; }
  #who { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #who button { width: auto; margin: 0; padding: 6px 10px; font-size: 12px; background: #EDE7F6; color: #281B5A; }
  button.ghost { background: #EDE7F6; color: #281B5A; }
  select { font: inherit; font-size: 16px; width: 100%; padding: 12px; border: 1px solid #CFC8E6; border-radius: 12px; margin-top: 10px; background: #fff; color: #1F1B2E; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #ov { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 24px 16px; }
  #ov .big { font-size: 30px; font-weight: 700; word-break: break-word; max-width: 520px; }
  #ov .small { font-size: 17px; margin-top: 10px; max-width: 520px; }
  #ov .spin { width: 56px; height: 56px; border: 6px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; margin-bottom: 18px; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>

  <div class="t"><b id="title">Check-in</b><span id="dayline">...</span></div>
  <div id="count"><b>–</b><span>checked in</span></div>
</header>
<main>
  <div id="setup" class="card" style="display:none">This page needs the full check-in link from the event team. Open that link on this phone.</div>
  <div id="staffBox" class="card" style="display:none">
    <div>Your name (written in the sheet next to each check-in):</div>
    <input id="staffName" placeholder="e.g. Ahmed" autocomplete="off">
    <button onclick="saveStaff()">Start</button>
  </div>
  <div id="app" style="display:none">
    <div id="queueNote" class="card"></div>
    <div id="reader"></div>
    <button id="camBtn" onclick="startCamera()" style="display:none">Start camera</button>
    <div id="result"></div>
    <input id="search" placeholder="No QR? Type name, phone or the 6-letter code" oninput="searchSoon()" autocomplete="off">
    <div id="people"></div>
    <button id="wkBtn" class="ghost" onclick="openWalkIn()">Not on the list? Add walk-in</button>
    <div id="wk" class="card" style="display:none">
      <b>Walk-in</b> <span class="muted">(only the name is required)</span>
      <input id="wkName" placeholder="Full name *" autocomplete="off">
      <input id="wkPhone" type="tel" inputmode="numeric" placeholder="Mobile, e.g. 01012345678" autocomplete="off">
      <input id="wkEmail" type="email" inputmode="email" placeholder="Email" autocomplete="off">
      <div class="two">
        <select id="wkGender"><option value="">Gender</option><option>Male</option><option>Female</option></select>
        <input id="wkAge" type="number" inputmode="numeric" placeholder="Age" min="18" max="100">
      </div>
      <input id="wkGov" list="lsGov" placeholder="Governorate" autocomplete="off">
      <input id="wkAff" list="lsAff" placeholder="Hospital / Institute" autocomplete="off">
      <div class="two">
        <input id="wkPos" list="lsPos" placeholder="Position" autocomplete="off">
        <select id="wkOnc"><option value="">Oncologist?</option><option>Yes</option><option>No</option></select>
      </div>
      <datalist id="lsGov"></datalist><datalist id="lsAff"></datalist><datalist id="lsPos"></datalist>
      <button id="wkSave" onclick="saveWalkIn()">Add and check in</button>
      <button class="ghost" onclick="closeWalkIn()">Cancel</button>
    </div>
    <p class="muted" id="who"><span id="whoName"></span><button onclick="changeStaff()">Change name</button></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // Link: #<key> on an event's own page (PRESET_A set), or #a=<check-in deployment>&k=<key>.
  // The link stays in the address bar, so a phone that cannot keep storage still works.
  var PRESET_A = "AKfycbyVsvExLLRzgOmcQetxa7K8lPW2cSnfTDbV9SGqWTPwWbnIZ6va-A1zTV6eNN3ZstZP";
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var raw = location.hash.slice(1), h = new URLSearchParams(raw);
  var API = PRESET_A || h.get("a") || "";
  var KEY = h.get("k") || (PRESET_A && raw && raw.indexOf("=") < 0 ? raw : "");
  var QKEY = "cjc_ci_queue_" + KEY.slice(0, 8);
  var staff = store("cjc_ci_staff") || "", scanner = null, lastCode = "", lastAt = 0, busy = false, searchTimer = null, mem = [];

  function api(params) {
    var u = "https://script.google.com/macros/s/" + API + "/exec?page=checkinapi&k=" + encodeURIComponent(KEY);
    Object.keys(params).forEach(function (k) { u += "&" + k + "=" + encodeURIComponent(params[k]); });
    return fetch(u, {redirect: "follow"}).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  // Scans made without internet wait here (phone storage, or memory if storage is blocked).
  function queue() { try { var s = store(QKEY); return s ? JSON.parse(s) : mem.slice(); } catch (e) { return mem.slice(); } }
  function setQueue(q) { mem = q.slice(); store(QKEY, JSON.stringify(q)); showQueue(); }
  function showQueue() {
    var n = queue().length, el = document.getElementById("queueNote");
    el.style.display = n ? "block" : "none";
    el.textContent = n + " scan(s) waiting for internet on this phone. They are sent by themselves when the internet is back - keep this page open.";
  }
  function beep(kind) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var tones = kind === "ok" ? [880] : kind === "already" ? [600, 600] : [220];
      tones.forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
        g.gain.value = 0.25; o.start(ctx.currentTime + i * 0.25); o.stop(ctx.currentTime + i * 0.25 + 0.18);
      });
      if (navigator.vibrate) navigator.vibrate(kind === "ok" ? 120 : [120, 80, 120]);
    } catch (e) {}
  }
  // Full-screen layer: opens the moment a code is read ("Checking..."), then shows the answer for 2 seconds.
  var ovOn = false, ovTimer = null;
  function hideOv() { if (busy) return; ovOn = false; clearTimeout(ovTimer); document.getElementById("ov").style.display = "none"; }
  function show(cls, big, small, keep) {
    var el = document.getElementById("result");
    el.className = cls; el.style.display = "block";
    el.innerHTML = '<div class="big"></div><div class="small"></div>';
    el.querySelector(".big").textContent = big;
    el.querySelector(".small").textContent = small || "";
    if (!ovOn) return;
    var ov = document.getElementById("ov");
    ov.className = cls; ov.style.display = "flex";
    ov.innerHTML = (keep ? '<div class="spin"></div>' : '') + '<div class="big"></div><div class="small"></div>';
    ov.querySelector(".big").textContent = big;
    ov.querySelector(".small").textContent = small || "";
    clearTimeout(ovTimer);
    if (!keep) ovTimer = setTimeout(hideOv, 2000);
  }
  function counts(a) {
    if (!a || !a.counts) return;
    document.getElementById("count").innerHTML = "<b></b><span></span>";
    document.querySelector("#count b").textContent = a.counts.inToday + " / " + a.counts.active;
    document.querySelector("#count span").textContent = "Day " + a.day + " in";
    document.getElementById("dayline").textContent = "Today = Day " + a.day;
  }
  function showAnswer(a) {
    counts(a);
    var day = "Day " + a.day;
    if (a.status === "ok") { show("ok", a.name, "Welcome - checked in, " + day); beep("ok"); }
    else if (a.status === "already") { show("already", a.name, "Already checked in, " + day + ", at " + a.at + (a.by ? " by " + a.by : "")); beep("already"); }
    else if (a.status === "cancelled") { show("bad", a.name, "Registration not accepted - ask the event manager"); beep("bad"); }
    else if (a.status === "unknown") { show("bad", "Unknown code", "This QR code is not from this event - search by name below"); beep("bad"); }
    else if (a.status === "busy") { show("wait", "Try again", "The sheet is busy - scan again"); }
    else if (a.status === "closed") { show("bad", "Check-in closed", "Ask the event team for the new check-in link"); }
    else { show("bad", "Error", a.error || a.status || ""); }
  }
  function handleCode(code) {
    code = String(code || "").trim();
    var now = Date.now();
    if (!code || busy || (code === lastCode && now - lastAt < 4000)) return;
    lastCode = code; lastAt = now; busy = true;
    ovOn = true;
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    show("wait", "Checking...", "Code read - please wait", true);
    api({do: "scan", code: code, staff: staff, at: now}).then(function (a) { busy = false; showAnswer(a); })
      .catch(function () {
        busy = false;
        var q = queue(); q.push({code: code, at: now}); setQueue(q);
        show("wait", "Saved on this phone", "No internet - it is sent when the internet is back");
      });
  }
  // Sends the waiting scans one by one; a scan leaves the queue only when the sheet answered (not "busy").
  function flushQueue() {
    var q = queue();
    if (!q.length || busy) return;
    api({do: "scan", code: q[0].code, staff: staff, at: q[0].at}).then(function (a) {
      if (a && a.status === "busy") return;
      setQueue(queue().slice(1)); counts(a); flushQueue();
    }).catch(function () {});
  }
  setInterval(flushQueue, 15000);
  window.addEventListener("online", flushQueue);

  function startCamera() {
    document.getElementById("camBtn").style.display = "none";
    if (!window.Html5Qrcode) { document.getElementById("camBtn").style.display = "block"; show("bad", "Camera not loaded", "Check the internet, then tap Start camera - or search by name below"); return; }
    scanner = scanner || new Html5Qrcode("reader");
    scanner.start({facingMode: "environment"}, {fps: 10, qrbox: function (w, hh) { var s = Math.floor(Math.min(w, hh) * 0.75); return {width: s, height: s}; }},
      handleCode, function () {})
      .catch(function (e) { document.getElementById("camBtn").style.display = "block"; show("bad", "Camera not started", "Tap Start camera and allow the camera (" + e + ")"); });
  }
  function saveStaff() {
    var v = document.getElementById("staffName").value.trim();
    if (!v) return;
    staff = v.slice(0, 40); store("cjc_ci_staff", staff);
    document.getElementById("staffBox").style.display = "none";
    ready();
  }
  function changeStaff() {
    document.getElementById("staffName").value = staff;
    document.getElementById("staffBox").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
  function searchSoon() { clearTimeout(searchTimer); searchTimer = setTimeout(search, 400); }
  function search() {
    var q = document.getElementById("search").value.trim(), box = document.getElementById("people");
    if (q.length < 3) { box.innerHTML = ""; return; }
    api({do: "search", q: q}).then(function (a) {
      if (document.getElementById("search").value.trim() !== q) return;
      box.innerHTML = "";
      (a.people || []).forEach(function (p) {
        var row = document.createElement("div"), t = document.createElement("span"), b = document.createElement("button");
        row.className = "p";
        t.textContent = p.name + (p.phoneEnd ? "  ..." + p.phoneEnd : "") + (p.cancelled ? "  (not accepted)" : p.inToday ? "  (already in)" : "");
        b.textContent = "Check in";
        b.onclick = function () { box.innerHTML = ""; document.getElementById("search").value = ""; lastCode = ""; handleCode(p.code); };
        row.appendChild(t); row.appendChild(b); box.appendChild(row);
      });
      if (a.status === "closed") box.innerHTML = '<p class="muted">Check-in closed.</p>';
      else if (!(a.people || []).length) box.innerHTML = '<p class="muted">Nobody found. Not accepted yet? Ask the event manager to approve the person.</p>';
    }).catch(function () { box.innerHTML = '<p class="muted">No internet.</p>'; });
  }
  // Walk-in: someone not on the list. Only the name is required; the person is added to the registrations
  // (accepted) and checked in for today in one step.
  function fillList(id, items) {
    var dl = document.getElementById(id); dl.innerHTML = "";
    (items || []).forEach(function (v) { var o = document.createElement("option"); o.value = v; dl.appendChild(o); });
  }
  function openWalkIn() {
    var q = document.getElementById("search").value.trim();
    document.getElementById("wk").style.display = "block";
    document.getElementById("wkBtn").style.display = "none";
    if (q && !/^\d/.test(q)) document.getElementById("wkName").value = q;
    else if (/^[\d+ ]{6,}$/.test(q)) document.getElementById("wkPhone").value = q;
    document.getElementById("wkName").focus();
  }
  function closeWalkIn() {
    ["wkName", "wkPhone", "wkEmail", "wkGender", "wkAge", "wkGov", "wkAff", "wkPos", "wkOnc"].forEach(function (id) { document.getElementById(id).value = ""; });
    document.getElementById("wk").style.display = "none";
    document.getElementById("wkBtn").style.display = "block";
  }
  function saveWalkIn() {
    var v = function (id) { return document.getElementById(id).value.trim(); };
    if (v("wkName").length < 3) { alert("Write the full name."); document.getElementById("wkName").focus(); return; }
    var b = document.getElementById("wkSave");
    if (b.disabled) return;
    b.disabled = true; b.textContent = "Saving...";
    show("wait", "Adding " + v("wkName") + "...", "");
    api({do: "walkin", name: v("wkName"), phone: v("wkPhone"), email: v("wkEmail"), gender: v("wkGender"), age: v("wkAge"),
         governorate: v("wkGov"), affiliation: v("wkAff"), position: v("wkPos"), oncologist: v("wkOnc"), staff: staff, at: Date.now()})
      .then(function (a) {
        b.disabled = false; b.textContent = "Add and check in";
        showAnswer(a);
        if (a.status === "ok" || a.status === "already") {
          if (a.matched === "existing") document.querySelector("#result .small").textContent += " - found their registration and accepted it";
          else document.querySelector("#result .small").textContent += " - added as walk-in";
          closeWalkIn(); document.getElementById("search").value = ""; document.getElementById("people").innerHTML = "";
        }
      })
      .catch(function () { b.disabled = false; b.textContent = "Add and check in"; show("bad", "No internet", "Nothing was saved - try again"); });
  }
  var started = false;
  function ready() {
    document.getElementById("app").style.display = "block";
    document.getElementById("whoName").textContent = "Checking in as: " + staff;
    if (!started) { started = true; startCamera(); }
    api({do: "hello"}).then(function (a) {
      if (a.status === "closed") { show("bad", "Check-in closed", "Ask the event team for the new check-in link"); return; }
      if (a.status !== "ok") { show("bad", "Error", a.error || a.status); return; }
      document.getElementById("title").textContent = a.eventName || "Check-in";
      counts(a);
      if (a.lists) { fillList("lsGov", a.lists.governorates); fillList("lsAff", a.lists.affiliations); fillList("lsPos", a.lists.positions); }
    }).catch(function () { show("wait", "No internet", "Scans are kept on this phone until the internet is back"); });
    showQueue(); flushQueue();
  }
  setInterval(function () { if (started && !document.hidden) api({do: "hello"}).then(counts).catch(function () {}); }, 60000);
  if (!API || !KEY) { document.getElementById("setup").style.display = "block"; document.getElementById("dayline").textContent = ""; }
  else if (!staff) document.getElementById("staffBox").style.display = "block";
  else ready();
</script>
</body>
</html>
