<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CJC Event</title>
<style>
  :root { --ink:#1F1B2E; --mute:#6B6880; --line:#E4E0EE; --bg:#F4F2F9; --card:#FFFFFF; --brand:#281B5A; --brand2:#6D28D9;
          --ok:#1E8E3E; --okbg:#E6F4EA; --warn:#B26A00; --warnbg:#FFF3DC; --bad:#B3261E; --badbg:#FCE8E6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; }
  header { background: linear-gradient(135deg, #281B5A, #4B2C8F); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header img { width: 40px; height: 40px; border-radius: 50%; background: #fff; flex: none; padding: 2px; box-shadow: 0 0 0 2px rgba(255,255,255,.35); image-rendering: auto; }
  header .t { flex: 1; min-width: 0; }
  header .t b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .t span { font-size: 12px; opacity: .8; }
  header button { flex: none; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 16px 8px; display: flex; gap: 8px; max-width: 640px; margin: 0 auto; }
  nav button { flex: 1; cursor: pointer; font: inherit; font-weight: 700; font-size: 14px; letter-spacing: .5px; padding: 10px 4px;
               border: 1.5px solid #CFC8E6; border-radius: 12px; background: #fff; color: var(--brand);
               box-shadow: 0 2px 0 #E1DBF1; transition: transform .08s, box-shadow .08s; }
  nav button small { display: block; font-size: 10.5px; font-weight: 500; color: var(--mute); letter-spacing: 0; }
  nav button:active { transform: translateY(2px); box-shadow: none; }
  nav button.on { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 3px 10px rgba(40,27,90,.25); }
  nav button.on small { color: #D8D0F5; }
  main { padding: 4px 16px 40px; max-width: 640px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 9px; min-width: 0;
          box-shadow: 0 1px 2px rgba(31,27,46,.05); border-top: 3px solid #D9D2F0; }
  .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
  .card .v { font-size: 22px; font-weight: 700; color: var(--brand); line-height: 1.1; }
  .card .p { font-size: 11px; font-weight: 700; color: var(--brand2); background: #F1ECFD; border-radius: 99px; padding: 2px 6px; white-space: nowrap; }
  .card .l { margin-top: 4px; font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.ok { border-top-color: var(--ok); } .card.ok .v { color: var(--ok); } .card.ok .p { color: var(--ok); background: var(--okbg); }
  .card.warn { border-top-color: #E8A33D; } .card.warn .p { color: var(--warn); background: var(--warnbg); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .box h3 { margin: 0; padding: 10px 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; background: #FAF8FE; border-bottom: 1px solid var(--line); }
  .box h3 small { color: var(--mute); font-weight: 400; }
  .row { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-bottom: 1px solid var(--line); min-height: 42px; }
  .row:last-child { border-bottom: 0; }
  .row .n { flex: none; width: 22px; color: var(--mute); font-size: 12px; text-align: center; }
  .row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .row.in { background: var(--okbg); }
  .row.gone { opacity: .55; }
  .row.head { min-height: 36px; background: #FAF8FE; font-size: 12px; font-weight: 600; color: var(--mute); }
  .chip { flex: none; min-width: 40px; text-align: center; font-size: 11px; padding: 3px 6px; border-radius: 999px; white-space: nowrap; }
  .chip.ok { background: var(--okbg); color: var(--ok); }
  .chip.warn { background: var(--warnbg); color: var(--warn); }
  .chip.bad { background: var(--badbg); color: var(--bad); }
  .chip.mute { background: #F0EEF6; color: var(--mute); }
  .mark { flex: none; width: 64px; text-align: center; font-weight: 700; font-size: 17px; }
  .row.head .mark { font-size: 12px; font-weight: 600; color: var(--mute); }
  .mark.ok { color: var(--ok); } .mark.no { color: #C9C5D6; }
  a.mark { text-decoration: none; }
  .bar { height: 10px; background: #EEEAF6; border-radius: 99px; overflow: hidden; flex: 1; }
  .bar i { display: block; height: 100%; background: var(--brand2); border-radius: 99px; }
  .gov { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14px; }
  .gov .g { width: 108px; flex: none; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gov .c { flex: none; width: 34px; text-align: right; font-weight: 700; }
  .gov .pc { flex: none; width: 46px; text-align: center; font-size: 11px; font-weight: 700; color: var(--brand2); background: #F1ECFD; border-radius: 99px; padding: 2px 0; }
  .ap { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid #C9C5D6; background: #fff; font-size: 16px; line-height: 24px; text-align: center; color: transparent; padding: 0; cursor: pointer; }
  .ap.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .ap.busy { border-style: dashed; color: var(--mute); }
  .msg { text-align: center; color: var(--mute); padding: 30px 10px; }
  .hidden { display: none; }
</style>
</head>

    // The link keeps its # part (copying the address bar gives a working link), and it is also kept on
    // the phone, so the page opens later without it. If the phone cannot keep it, the link still works.
    if (a && m) { if (!PRESET_A) store("cjc_mg_a", a); store(SKEY, m); window.__A = a; window.__M = m; }
  })();
  var A = window.__A || PRESET_A || store("cjc_mg_a") || "", M = window.__M || store(SKEY) || "", D = null;
  function api(p) {
    var u = "https://script.google.com/macros/s/" + A + "/exec?page=mgrapi&m=" + encodeURIComponent(M);
    Object.keys(p).forEach(function (k) { u += "&" + k + "=" + encodeURIComponent(p[k]); });
    return fetch(u, {redirect: "follow"}).then(function (r) { return r.json(); });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  // Long names: first two names and the last one, so a row stays on one line on a phone.
  function short(n) { var w = String(n || "").trim().split(/\s+/); return w.length > 3 ? [w[0], w[1], w[w.length - 1]].join(" ") : w.join(" "); }
  function pct(a, b) { return b ? Math.round(a * 100 / b) + "%" : "0%"; }
  // A score card: the number, its share as a separate badge, and the label under them.
  function card(value, label, share, cls) {
    var c = el("div", "card" + (cls ? " " + cls : "")), top = el("div", "top");
    top.appendChild(el("span", "v", value));
    if (share) top.appendChild(el("span", "p", share));
    c.appendChild(top); c.appendChild(el("div", "l", label));
    return c;
  }
  function tab(t) {
    ["att", "spk", "mys"].forEach(function (x) { document.getElementById(x).classList.toggle("hidden", x !== t); });
    document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.t === t); });
    window.scrollTo(0, 0);
  }

  function load() {
    if (!A || !M) { document.getElementById("up").textContent = "Manager link needed"; return Promise.resolve(); }
    document.getElementById("up").textContent = "Updating...";
    return api({do: "data"}).then(function (d) {
      if (d.status !== "ok") { document.getElementById("up").textContent = d.status === "closed" ? "This link is closed" : "Error: " + (d.error || ""); return; }
      D = d;
      document.getElementById("ev").textContent = d.event.name;
      document.getElementById("up").textContent = "Updated " + d.updated;
      drawAtt(); drawSpk(); drawMys();
    }).catch(function () { document.getElementById("up").textContent = "No internet - retrying"; });
  }

  function drawAtt() {
    var box = document.getElementById("att"); box.innerHTML = "";
    var list = D.att.filter(function (p) { return !p.apology; });
    var acc = list.filter(function (p) { return p.accepted; });
    var back = list.filter(function (p) { return p.before > 0; }).length;
    var day = D.event.today, inKey = day === 2 ? "d2" : "d1";
    var arrived = acc.filter(function (p) { return p[inKey]; }).length;
    var groups = {};
    list.forEach(function (p) { (groups[p.gov] = groups[p.gov] || []).push(p); });
    var names = Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; });
    var cards = el("div", "cards");
    cards.appendChild(card(list.length, "Registered"));
    cards.appendChild(card(acc.length, "Approved", pct(acc.length, list.length)));
    cards.appendChild(card(arrived, "Arrived · Day " + day, pct(arrived, acc.length), "ok"));
    cards.appendChild(card(back, "Returning", pct(back, list.length), "warn"));
    cards.appendChild(card(list.length - back, "New", pct(list.length - back, list.length)));
    cards.appendChild(card(names.length, "Governorates"));
    box.appendChild(cards);

    var top = el("div", "box"), h = el("h3");
    h.appendChild(el("span", "", "Top governorates")); top.appendChild(h);
    var rows = names.slice(0, 3).map(function (g) { return [g, groups[g].length]; });
    var rest = names.slice(3).reduce(function (s, g) { return s + groups[g].length; }, 0);
    if (rest) rows.push(["Others", rest]);
    rows.forEach(function (x) {
      var r = el("div", "gov"); r.appendChild(el("span", "g", x[0]));
      var b = el("div", "bar"), i = el("i"); i.style.width = pct(x[1], list.length); b.appendChild(i); r.appendChild(b);
      r.appendChild(el("span", "c", x[1])); r.appendChild(el("span", "pc", pct(x[1], list.length)));
      top.appendChild(r);
    });
    box.appendChild(top);

    names.forEach(function (g) {
      var sec = el("div", "box"), hh = el("h3");
      var arrivedG = groups[g].filter(function (p) { return p.accepted && p[inKey]; }).length;
      hh.appendChild(el("span", "", g));
      hh.appendChild(el("small", "", groups[g].length + " registered" + (arrivedG ? " · " + arrivedG + " arrived" : "")));
      sec.appendChild(hh);
      groups[g].forEach(function (p, i) {
        var r = el("div", "row" + (p.accepted && p[inKey] ? " in" : ""));
        r.appendChild(el("span", "n", i + 1));
        r.appendChild(el("span", "nm", short(p.name)));
        r.appendChild(p.before > 0 ? el("span", "chip warn", p.before + "×") : el("span", "chip mute", "New"));
        var b = el("button", "ap" + (p.accepted ? " on" : ""), "✓");
        b.title = p.accepted ? "Approved - tap to remove" : "Approve";
        b.onclick = function () { approve(p, b); };
        r.appendChild(b);
        sec.appendChild(r);
      });
      box.appendChild(sec);
    });
    var gone = D.att.filter(function (p) { return p.apology; });
    if (gone.length) {
      var s = el("div", "box"), hg = el("h3");
      hg.appendChild(el("span", "", "Apologised")); hg.appendChild(el("small", "", gone.length)); s.appendChild(hg);
      gone.forEach(function (p, i) { var r = el("div", "row gone"); r.appendChild(el("span", "n", i + 1)); r.appendChild(el("span", "nm", short(p.name))); s.appendChild(r); });
      box.appendChild(s);
    }
  }

  // Tap an empty box to approve, tap a ticked box to remove the approval.
  function approve(p, b) {
    if (b.classList.contains("busy")) return;
    var removing = p.accepted;
    if (!confirm(removing ? "Remove the approval of " + p.name + "? Their entry code will stop working." : "Approve " + p.name + "?")) return;
    b.classList.add("busy"); b.textContent = "…";
    api({do: removing ? "unapprove" : "approve", id: p.id}).then(function (a) {
      if (a.status === "ok") { p.accepted = !removing; drawAtt(); load(); }
      else { b.classList.remove("busy"); b.textContent = "✓"; alert(a.status === "busy" ? "The sheet is busy - try again." : "Not saved: " + (a.error || a.status)); }
    }).catch(function () { b.classList.remove("busy"); b.textContent = "✓"; alert("No internet."); });
  }

  function drawSpk() {
    var box = document.getElementById("spk"); box.innerHTML = "";
    var active = D.spk.filter(function (s) { return s.status === "Active"; });
    var conf = active.filter(function (s) { return s.confirmed; }).length;
    var cards = el("div", "cards");
    cards.appendChild(card(active.length, "Speakers"));
    cards.appendChild(card(conf, "Confirmed", pct(conf, active.length), "ok"));
    cards.appendChild(card(active.length - conf, "Waiting", pct(active.length - conf, active.length), "warn"));
    box.appendChild(cards);
    var sec = el("div", "box"), seen = {};
    D.spk.filter(function (s) { var k = s.name + s.status; if (seen[k]) return false; seen[k] = true; return true; }).forEach(function (s, i) {
      var r = el("div", "row" + (s.status !== "Active" ? " gone" : ""));
      r.appendChild(el("span", "n", i + 1));
      r.appendChild(el("span", "nm", short(s.name)));
      r.appendChild(s.status !== "Active" ? el("span", "chip bad", /^APOLOG/.test(s.status) ? "Apologised" : "Removed") :
        s.confirmed ? el("span", "chip ok", "Confirmed") : s.sent ? el("span", "chip warn", "Sent") : el("span", "chip mute", "Not sent"));
      sec.appendChild(r);
    });
    box.appendChild(sec);
  }

  function drawMys() {
    var box = document.getElementById("mys"); box.innerHTML = "";
    var active = D.spk.filter(function (s) { return s.status === "Active"; });
    var des = active.filter(function (s) { return s.design; }).length, post = active.filter(function (s) { return s.post; }).length;
    var cards = el("div", "cards");
    cards.appendChild(card(active.length, "Speakers"));
    cards.appendChild(card(des, "Designed", pct(des, active.length), "ok"));
    cards.appendChild(card(post, "Posted", pct(post, active.length), "ok"));
    box.appendChild(cards);
    var sec = el("div", "box"), hh = el("div", "row head");
    hh.appendChild(el("span", "n", "#")); hh.appendChild(el("span", "nm", "Speaker"));
    hh.appendChild(el("span", "mark", "Design")); hh.appendChild(el("span", "mark", "Post"));
    sec.appendChild(hh);
    active.forEach(function (s, i) {
      var r = el("div", "row");
      r.appendChild(el("span", "n", i + 1));
      r.appendChild(el("span", "nm", short(s.name)));
      [s.design, s.post].forEach(function (link) {
        var m = el(link ? "a" : "span", "mark " + (link ? "ok" : "no"), link ? "✓" : "–");
        if (link && /^https?:/.test(link)) { m.href = link; m.target = "_blank"; m.rel = "noopener"; }
        r.appendChild(m);
      });
      sec.appendChild(r);
    });
    box.appendChild(sec);
  }

  if (!A || !M) { document.getElementById("att").innerHTML = '<p class="msg">This page needs the full manager link (the one that ends with #a=...&amp;m=...). Open that link once on this phone.</p>'; document.getElementById("up").textContent = ""; }
  else { load(); setInterval(function () { if (!document.hidden) load(); }, 60000); }
</script>
